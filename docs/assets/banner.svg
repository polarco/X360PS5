    <text x="88" y="326" fill="#8b949e" font-size="14">Console validation pending · No game compatibility claims</text>
  </g>
  <g fill="none" stroke-width="2"><circle cx="1040" cy="180" r="116" stroke="#58a6ff" opacity=".18"/><circle cx="1040" cy="180" r="87" stroke="#7ee787" opacity=".35"/><path d="M943 123L1137 237M943 237L1137 123" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" opacity=".85"/><circle cx="1040" cy="180" r="145" stroke="#58a6ff" opacity=".08"/></g>
