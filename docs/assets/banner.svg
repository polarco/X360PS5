<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">X360PS5</title>
  <desc id="desc">Xbox 360 to PS5 research. Experimental. AI-assisted development. Console validation pending.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#14263a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7ee787"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect x="56" y="55" width="5" height="245" rx="2" fill="url(#accent)"/>
