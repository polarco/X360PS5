    <text x="82" y="182" fill="#f0f6fc" font-size="88" font-weight="700" letter-spacing="-4">X360<tspan fill="#7ee787">PS5</tspan></text>
    <text x="88" y="223" fill="#b8c7d9" font-size="22">PowerPC → x86-64 · Xenia · Vulkan</text>
    <rect x="88" y="256" width="166" height="32" rx="16" fill="#352d19"/>
    <text x="171" y="277" text-anchor="middle" fill="#f2cc60" font-size="13" font-weight="600">EXPERIMENTAL</text>
